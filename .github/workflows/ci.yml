# MiniShop — CI GitHub Actions (dev) — adaptation de .gitlab-ci.yml pour GitHub
# Contexte : GitLab reste la cible de prod (barème CT-09, §14.2), mais le dev
# avant la prod se fait sur GitHub. Ce workflow reproduit 1:1 les 6 jobs GitLab,
# plus un 7e propre à GitHub (dev-router, matrice Linux+Windows — tests/php/dev_router_test.php)
# en syntaxe GitHub Actions, avec les mêmes garanties : syntaxe PHP bloquante,
# 29 tests SQL, contrôles sécurité, PlantUML.
#
# Déclenchement : push et PR sur main / arena/* / dev / develop (interruptible).
# Concurrence : annule le run précédent sur la même branche (comme GitLab interruptible).
# Images : php:8.2, mysql:8.0, openjdk:17 — identiques à .gitlab-ci.yml
#
# Correspondance GitLab → GitHub :
#   stages [validate, db, test, docs] → jobs avec `needs:`
#   php-lint (validate, image php:8.2-cli) → job php-lint (setup-php 8.2)
#   style (validate, allow_failure) → job style (continue-on-error: true)
#   security-scan (alpine, tests/security/controles.sh) → job security-scan (même script + --selftest ;
#                                                          fallback grep dégradé seulement si le script manque)
#   base-tests (db, mysql:8.0 service, load_db.sh + run_sql_tests.sh) → job db-tests (services mysql:8.0, fallback SQL direct si scripts absents)
#   unit (test, php:8.2 + mysql service, composer + phpunit) → job unit (setup-php + composer + phpunit, skip si pas de composer.json)
#   docs (openjdk, plantuml.jar + render.sh) → job docs (setup-java 17 + plantuml)
#
# Usage local (act) : `act -j php-lint` ou `gh workflow run ci.yml`
#
# Règle de re-run (CDC §14.2, annexe 17.9 §7) : si le run de la PR est VERT avant le merge,
# aucun re-run n'est nécessaire après le merge. GitHub Actions exécute déjà le workflow
# `pull_request` sur le commit de fusion (`refs/pull/<n>/merge`) : le run déclenché sur main
# après le merge rejoue les mêmes 6 jobs sur le même arbre de fichiers — c'est un relais de
# traçabilité (badge main), pas une vérification. On ne relance donc jamais « Re-run jobs » /
# `gh run rerun` dans ce cas ; seules exceptions : main a avancé, run annulé
# (concurrency/cancel-in-progress), correction déjà poussée (le push relance seul), panne
# d'infrastructure (alors `gh run rerun <id> --failed`, une fois).

name: CI — MiniShop (dev/GitHub)

# Nom lisible du run : met en évidence qu'un run post-merge est un simple relais
# (déjà validé en PR) — aucune action attendue de la part de l'équipe.
run-name: >-
  ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') &&
      format('post-merge — relais de traçabilité, déjà validé en PR : aucun re-run nécessaire — {0}', github.sha) ||
      format('{0} — {1}', github.event_name, github.ref_name) }}

on:
  push:
    branches: [main, master, dev, develop, "arena/**", "feature/**", "feat/**"]
  pull_request:
    branches: [main, master, dev, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Variables communes (comme .gitlab-ci.yml `variables:`)
  DB_TEST: minishop_test
  MYSQL_DATABASE: minishop_test
  DB_HOST: 127.0.0.1
  DB_USER: root
  DB_PASS: ""

jobs:
  # -----------------------------------------------------------------
  # 1. Syntaxe PHP : 100 % des fichiers doivent être valides (§11.3 PRÉ-3).
  #    Bloquant — reproduit `php-lint` GitLab.
  # -----------------------------------------------------------------
  php-lint:
    name: php-lint (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: none
      - name: Lint app + public
        run: |
          echo "== php -l sur app/ public/ scripts/ tests/php/ =="
          if [ ! -d app ] && [ ! -d public ]; then echo "aucun dossier app/public, skip"; exit 0; fi
          find app public scripts tests/php -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
          echo "✓ syntaxe OK"

  # Dépréciations : les suites isolées ne créent ni base SQL ni données E2E.
  deprecations:
    name: Dépréciations PHP ${{ matrix.php }} et suites isolées
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.5"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: none
      - name: Analyse et tests sans SQL ni E2E
        shell: bash
        run: |
          set +e
          php scripts/run-all-tests.php --sans-sql --sans-e2e 2>&1 | tee "$RUNNER_TEMP/minishop-tests.log"
          etat=${PIPESTATUS[0]}
          set -e
          if [ "$etat" -ne 0 ]; then
            # Résumé consultable via les annotations même si les logs sont indisponibles.
            grep -E '❌|ERROR:|FAIL:|AssertionError|Fatal error|Parse error|Deprecated:' "$RUNNER_TEMP/minishop-tests.log" | head -20 | while IFS= read -r ligne; do
              ligne=${ligne//%/%25}
              echo "::error::${ligne}"
            done || true
          fi
          exit "$etat"

      - name: Contrats HTTP 403 sur serveur PHP temporaire
        shell: bash
        run: |
          set +e
          python3 tests/python/test_auth_403_http.py -v 2>&1 | tee "$RUNNER_TEMP/auth403.log"
          etat=${PIPESTATUS[0]}
          set -e
          if [ "$etat" -ne 0 ]; then
            tail -8 "$RUNNER_TEMP/auth403.log" | while IFS= read -r ligne; do
              ligne=${ligne//%/%25}
              echo "::error::${ligne}"
            done
          fi
          exit "$etat"

  e2e-isolation:
    name: E2E WASM et isolation des données
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node tests/node/e2e_isolation.mjs

  # -----------------------------------------------------------------
  # 1b. Routeur de développement `php -S` (scripts/dev-router.php) :
  #     suite noire tests/php/dev_router_test.php — vrai serveur intégré
  #     lancé en sous-processus (démarrage, fichiers réels de public/,
  #     404 du frontal, traversées). Matrice ubuntu + windows : c'est le
  #     seul endroit où le lancement Windows/XAMPP (chemins, séparateurs
  #     %5c, cwd étranger) est testé pour de vrai, PHP natif oblige.
  #     MINISHOP_ROUTER_TEST_STRICT=1 : un SKIP y est un échec.
  # -----------------------------------------------------------------
  dev-router:
    name: dev-router (php -S ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MINISHOP_ROUTER_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl
          coverage: none
          tools: none
      - name: Tests unitaires en PHP natif (ext-intl présente)
        run: python scripts/ci_php_diagnostic.py tests/php/unit_tests.php
      - name: Tests du routeur de développement
        run: php tests/php/dev_router_test.php

  # -----------------------------------------------------------------
  # 1c. E2E UI (clics réels sur les pages) : Admin > Catégories —
  #     doublon de nom refusé, catégorie existante intacte ; et Panier —
  #     bouton « Valider ma commande » (vrai <button>, feuille servie).
  #     scripts/ui-e2e-*.mjs pilotent le DOM (jsdom) contre le vrai
  #     serveur php -S ; les régressions sont aussi verrouillées en PHP
  #     natif avant les parcours UI (categorie_doublon_test.php,
  #     panier_cta_test.php).
  # -----------------------------------------------------------------
  ui-e2e:
    name: ui-e2e (clics Admin > Catégories)
    runs-on: ubuntu-latest
    env:
      UI_TEST_INSTANCE_JETABLE: "1" # runner GitHub Actions jetable
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl
          coverage: none
          tools: none
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dépendances dev (jsdom, php-wasm)
        run: npm ci --ignore-scripts
      - name: Régression doublon de catégorie (Repository, PHP natif)
        run: php tests/php/categorie_doublon_test.php
      - name: Régression bouton panier (vue + CSS + CSP, PHP natif)
        run: php tests/php/panier_cta_test.php
      - name: Régression page À propos (contenu visiteur, PHP natif)
        run: php tests/php/apropos_test.php
      - name: Régression heures décalées (UTC→Europe/Paris, PHP natif)
        run: php tests/php/heure_test.php
      - name: Régression adresse de livraison incomplète (préremplissage, PHP natif)
        run: php tests/php/adresse_livraison_test.php
      - name: Régression annulation/suppressions sans confirmation (PHP natif)
        run: php tests/php/actions_destructrices_test.php
      - name: Régression stocks — mode par défaut écrasant (PHP natif)
        run: php tests/php/stocks_defaut_test.php
      - name: Régression pied de page — pages Aide/Livraison/Confidentialité/Rétractation (PHP natif)
        run: php tests/php/pages_pied_de_page_test.php
      - name: Régression catalogue — filtres en haut derrière « Filtrer » (PHP natif)
        run: php tests/php/catalogue_filtres_test.php
      - name: Régression fiche produit — tableau Caractéristiques tenu en page (PHP natif)
        run: php tests/php/fiche_produit_test.php
      - name: Régression panier — mise en page du tableau (PHP natif)
        run: php tests/php/panier_tableau_test.php
      - name: Régression commandes admin — colonne Statut tenue en page (PHP natif)
        run: php tests/php/commandes_tableau_test.php
      - name: Régression catégories admin — page tenue en page (PHP natif)
        run: php tests/php/categories_tableau_test.php
      - name: Régression alignement Produit et Référence, panier stocks alertes (PHP natif)
        run: php tests/php/alignement_colonnes_test.php
      - name: Régression formulaires produit, catégories, produits, catalogue (PHP natif)
        run: php tests/php/formulaires_admin_test.php
      - name: Régression divers panier, Top 5, photos, description, pied de page, contact (PHP natif)
        run: php tests/php/divers_test.php
      - name: Régression codes techniques visibles, vues, messages, motifs, historique (PHP natif)
        run: php tests/php/codes_techniques_test.php
      - name: Régression CGV article 4, annulation avant expédition et pas rétractation (PHP natif)
        run: php tests/php/cgv_retractation_test.php
      - name: Régression mentions légales, éditeur, contact, hébergeur, BUT2 (PHP natif)
        run: php tests/php/mentions_legales_test.php
      - name: Régression contact, réponse non promise, données cohérentes (PHP natif)
        run: php tests/php/contact_coherence_test.php
      - name: Régression annulation, historique conservé, montant soldé (PHP natif)
        run: php tests/php/annulation_historique_test.php
      - name: Régression valider ma commande, récapitulatif tenu en page à 375 px (PHP natif)
        run: php tests/php/valider_recap_test.php
      - name: Regression PHP - Inscription erreurs simultanees et saisie conservee (echec attendu si le correctif est absent)
        run: php tests/php/inscription_erreurs_test.php
      - name: Regression PHP - Mes commandes tableau 375px et legende (echec attendu si le correctif est absent)
        run: php tests/php/mes_commandes_tableau_test.php
      - name: Données de démonstration d'usine (comptes de démo du seed)
        run: php scripts/seed.php
      - name: Démarrer l'application (php -S + dev-router)
        run: |
          php -S 127.0.0.1:8093 -t public scripts/dev-router.php > ui-server.log 2>&1 &
          echo $! > ui-server.pid
      - name: E2E UI — Admin > Catégories (clics)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-categories.mjs
      - name: E2E UI — Panier, bouton « Valider ma commande » (clics)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-panier.mjs
      - name: E2E UI — Page À propos (navigation + contenu visiteur)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-apropos.mjs
      - name: E2E UI — Heures des commandes (Paris à l'écran, pas UTC)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-heure.mjs
      - name: E2E UI — Annulation et suppressions confirmées (pas d'action définitive en un clic)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-annulation.mjs
      - name: E2E UI — Stocks, « Ajouter / retirer » par défaut (+3 sans toucher au mode)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-stocks.mjs
      - name: E2E UI — Pied de page (Aide, Livraison, Confidentialité, Rétractation liées et en 200)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-pied-de-page.mjs
      - name: E2E UI — Catalogue format mobile (filtres en haut, repliés derrière « Filtrer »)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-catalogue.mjs
      - name: E2E UI — Fiche produit (tableau Caractéristiques, valeurs affichées, tenu en page)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-produit.mjs
      - name: E2E UI — Panier, mise en page du tableau (légende, alignements, totaux)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-panier-tableau.mjs
      - name: E2E UI — Commandes admin, colonne Statut tenue en page (pilotage)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-commandes-tableau.mjs
      - name: E2E UI — Catégories admin, page tenue en page (boutons entiers)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-categories-tableau.mjs
      - name: E2E UI — Alignement Produit et Référence (panier, stocks, alertes)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-alignement.mjs
      - name: E2E UI — Formulaires alignés (produit, catégories, produits, catalogue)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-formulaires.mjs
      - name: E2E UI — Divers (panier, Top 5, photos, description, pied de page, contact)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-divers.mjs
      - name: E2E UI — Codes techniques (panier, validation, historique, pages légales, back-office)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-codes.mjs
      - name: E2E UI — CGV article 4 (annulation avant expédition, page Rétractation, détail commande)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-retractation.mjs
      - name: E2E UI — Mentions légales (éditeur, contact, hébergeur, BUT2)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-mentions.mjs
      - name: E2E UI — Contact (réponse non promise, confidentialité, mentions légales, pied de page)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-contact.mjs
      - name: E2E UI — Annulation (articles conservés, total avant annulation, montant soldé)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-annulation-historique.mjs
      - name: E2E UI — Valider à 375 px (récapitulatif, libellés et montants ensemble, total au bouton)
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-valider.mjs
      - name: E2E navigateur - erreurs d inscription simultanees et saisie conservee
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-inscription.mjs --port=8138
      - name: E2E navigateur - Mes commandes montant et detail en page a 375px
        env:
          UI_BASE_URL: http://127.0.0.1:8093
        run: node scripts/ui-e2e-mes-commandes.mjs --port=8140
      - name: Arrêter le serveur et publier son journal si échec
        if: always()
        run: |
          kill "$(cat ui-server.pid)" 2>/dev/null || true
          cat ui-server.log || true

  # -----------------------------------------------------------------
  # 2. Conventions PSR-12 : signalées, non bloquantes (allow_failure)
  # -----------------------------------------------------------------
  style:
    name: style PSR-12 (allow_failure)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: phpcs
      - name: phpcs PSR-12
        run: |
          if ! command -v phpcs >/dev/null 2>&1; then
            echo "phpcs absent, tentative pear/composer"
            pear install -f PHP_CodeSniffer 2>/dev/null || composer global require squizlabs/php_codesniffer --no-interaction || true
          fi
          phpcs --standard=PSR12 --report=summary app public || true
          echo "style : non bloquant (GitLab allow_failure: true)"

  # -----------------------------------------------------------------
  # 3. Contrôles statiques de sécurité : 10 grep bloquants
  #    (interpolation SQL, échappement manquant, mot de passe en dur,
  #     session durcie, CSRF, contrôle d'appartenance)
  # -----------------------------------------------------------------
  security-scan:
    name: security-scan (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Auto-test des motifs (les contrôles doivent savoir mordre)
        if: hashFiles('tests/security/controles.sh') != ''
        shell: bash
        run: bash tests/security/controles.sh --selftest

      - name: Contrôles sécurité
        shell: bash
        run: |
          set -uo pipefail
          if [ -f tests/security/controles.sh ]; then
            echo "→ tests/security/controles.sh présent — 10 contrôles du CDC §15.3"
            bash tests/security/controles.sh
            exit $?
          fi

          # ------------------------------------------------------------------
          # FALLBACK (script absent). Il ne doit JAMAIS crier au loup : un
          # contrôle qui échoue sur du code sain apprend à l'équipe à ignorer
          # la CI. On cherche donc des MOTIFS dangereux, pas des MOTS.
          # ------------------------------------------------------------------
          echo "→ tests/security/controles.sh absent — fallback grep dégradé"
          echo "  (le script complet est la référence : ce fallback ne couvre que 5 invariants)"

          echo "[1/5] Interpolation d'une variable dans une chaîne SQL ?"
          if grep -R --include='*.php' -nE '(query|exec|prepare)[[:space:]]*\([[:space:]]*"[^"]*\$' app/ public/ 2>/dev/null; then
            echo "⚠ concaténation/interpolation SQL détectée"; exit 1
          fi
          echo "✓ OK"

          # Le contrôle historiquement faux. `grep -riE "mot.?de.?passe" app/` remonte
          # 63 lignes sur ce dépôt, dont :
          #   <input type="password" id="mot_de_passe" name="mot_de_passe" required>
          # Un nom de champ de formulaire n'est pas un identifiant en dur. On exige
          # ici l'AFFECTATION D'UN LITTÉRAL non vide, et on écarte le balisage HTML.
          echo "[2/5] Secret littéral affecté à une variable/constante/clé ?"
          hits=$(
            {
              grep -R --include='*.php' -nE '\$(mot_de_passe|motdepasse|mdp|password|passwd|pass|pwd|secret|token|api_key)[A-Za-z0-9_]*[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"'$]{3,}["'"'"']' app/ public/ 2>/dev/null
              grep -R --include='*.php' -nE '(define|putenv|setenv)[[:space:]]*\([[:space:]]*["'"'"'][A-Za-z_]*(PASS|PASSWD|PWD|MOT_DE_PASSE|SECRET|TOKEN|API_KEY)[A-Za-z_]*["'"'"'][[:space:]]*,[[:space:]]*["'"'"'][^"'"'"'$]{3,}["'"'"']' app/ public/ 2>/dev/null
              grep -R --include='*.php' -nE '["'"'"'](db_pass|db_password|mot_de_passe|password|passwd|pwd|secret|api_key)["'"'"'][[:space:]]*=>[[:space:]]*["'"'"'][^"'"'"'$]{3,}["'"'"']' app/ public/ 2>/dev/null
              grep -R --include='*.php' -nE -e '->set[Pp]ass(word)?[[:space:]]*\([[:space:]]*["'"'"'][^"'"'"'$]{3,}["'"'"']' app/ public/ 2>/dev/null
            } | grep -vEi 'name=|id=|for=|placeholder=|autocomplete=|<input|<label|type="password"' \
              | grep -vE 'password_hash|password_verify|PASSWORD_BCRYPT|PASSWORD_DEFAULT|PASSWORD_ARGON' \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(\*|//|#)'
          )
          if [ -n "$hits" ]; then
            echo "$hits"; echo "⚠ secret en dur"; exit 1
          fi
          echo "✓ OK (les champs <input type=\"password\"> sont ignorés : ce ne sont pas des secrets)"

          echo "[3/5] Échappement HTML dans les vues ?"
          if [ -d app/View ]; then
            brut=$(grep -R --include='*.php' -nE '(echo|<\?=)[[:space:]]*\$[A-Za-z_]' app/View 2>/dev/null \
              | grep -vE '\be\(|euros\(|date_fr\(|statut_libelle\(|etat_libelle\(|csrf_field\(|\$v\(|\$qs\(|HTML-SAFE' \
              | grep -vE '^app/View/layout\.php:[0-9]+:[[:space:]]*<\?=[[:space:]]*\$contenu[[:space:]]*\?>')
            if [ -n "$brut" ]; then echo "$brut"; echo "⚠ sortie non échappée"; exit 1; fi
            echo "✓ OK"
          else
            echo "ℹ app/View absent, skip"
          fi

          echo "[4/5] Session durcie (httponly, samesite, regenerate) ?"
          manque=""
          grep -Rq "'httponly'[[:space:]]*=>[[:space:]]*true" app/ 2>/dev/null || manque="$manque HttpOnly"
          grep -Rq "session_regenerate_id\|regenererId" app/ 2>/dev/null || manque="$manque regenerate"
          if [ -n "$manque" ]; then echo "⚠ durcissement incomplet :$manque"; exit 1; fi
          echo "✓ OK"

          echo "[5/5] CSRF comparé en temps constant ?"
          if ! grep -Rq 'hash_equals' app/ 2>/dev/null; then
            echo "⚠ jeton CSRF non comparé avec hash_equals()"; exit 1
          fi
          echo "✓ OK"
          echo "✓ security-scan (fallback) : 5 invariants vérifiés"

  # -----------------------------------------------------------------
  # 4. Base de données : chargement du schéma puis 29 tests (règles, vues, port)
  #    Porte les points « script SQL », « procédures stockées », « triggers »
  # -----------------------------------------------------------------
  db-tests:
    name: db-tests (mysql 8.0)
    runs-on: ubuntu-latest
    needs: [php-lint, security-scan]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: minishop_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ""
      DB_TEST: minishop_test
      MYSQL_DATABASE: minishop_test
    steps:
      - uses: actions/checkout@v5

      - name: Install mariadb-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mariadb-client
          mysqladmin ping -h 127.0.0.1 --wait=60 || (docker ps; ss -ltn; exit 1)

      - name: Load DB (scripts/load_db.sh ou fallback SQL direct)
        shell: bash
        run: |
          set -euxo pipefail
          echo "== Vérif SQL présents =="
          ls -lh sql/
          if [ -f scripts/load_db.sh ]; then
            echo "→ scripts/load_db.sh présent (GitLab originel)"
            chmod +x scripts/load_db.sh
            DB=minishop DB_NAME=minishop DB_HOST=127.0.0.1 DB_USER=root DB_PASS="" ./scripts/load_db.sh
            DB=minishop_test DB_NAME=minishop_test DB_HOST=127.0.0.1 DB_USER=root DB_PASS="" ./scripts/load_db.sh
          else
            echo "→ scripts/load_db.sh absent — fallback chargement direct (GitHub dev)"
            # Crée les deux bases (prod seed + test)
            mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS minishop CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS minishop_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            for DB in minishop minishop_test; do
              echo "--- chargement $DB ---"
              # 01 : DDL + seed (crée et USE minishop — on force le bon DB via sed pour minishop_test)
              if [ "$DB" = "minishop_test" ]; then
                sed -e 's/DROP DATABASE IF EXISTS minishop;/DROP DATABASE IF EXISTS minishop_test;/' \
                    -e 's/CREATE DATABASE IF NOT EXISTS minishop /CREATE DATABASE IF NOT EXISTS minishop_test /' \
                    -e 's/USE minishop;/USE minishop_test;/' \
                    sql/01_minishop_schema.sql | mysql -h 127.0.0.1 -u root
              else
                mysql -h 127.0.0.1 -u root < sql/01_minishop_schema.sql
              fi
              mysql -h 127.0.0.1 -u root "$DB" < sql/02_minishop_procedures.sql
              mysql -h 127.0.0.1 -u root "$DB" < sql/03_minishop_triggers.sql
              mysql -h 127.0.0.1 -u root "$DB" < sql/04_minishop_demo.sql
              echo "✓ $DB chargé"
            done
          fi
          echo "== Comptage objets =="
          mysql -h 127.0.0.1 -u root -e "
            SELECT 'minishop tables' AS db, COUNT(*) n FROM information_schema.tables WHERE table_schema='minishop'
            UNION ALL SELECT 'minishop_test tables', COUNT(*) FROM information_schema.tables WHERE table_schema='minishop_test'
            UNION ALL SELECT 'minishop procedures', COUNT(*) FROM information_schema.routines WHERE routine_schema='minishop' AND routine_type='PROCEDURE'
            UNION ALL SELECT 'minishop triggers', COUNT(*) FROM information_schema.triggers WHERE trigger_schema='minishop';
          " || true

      - name: Run SQL tests (scripts/run_sql_tests.sh ou fallback)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/run_sql_tests.sh ]; then
            echo "→ scripts/run_sql_tests.sh présent"
            chmod +x scripts/run_sql_tests.sh
            set +e
            DB_HOST=127.0.0.1 DB_USER=root DB_PASS="" DB_TEST=minishop_test ./scripts/run_sql_tests.sh 2>&1 | tee "$RUNNER_TEMP/sql-tests.log"
            etat=${PIPESTATUS[0]}
            set -e
            if [ "$etat" -ne 0 ]; then
              grep -E 'ERREUR|ERROR|\[FAIL\]|\[FIX\]|attendu |Tests conformes' "$RUNNER_TEMP/sql-tests.log" | head -25 | while IFS= read -r ligne; do
                ligne=${ligne//%/%25}
                echo "::error::${ligne}"
              done || true
              exit "$etat"
            fi
          else
            echo "→ scripts/run_sql_tests.sh absent — vérif manuelle minimale"
            mysql -h 127.0.0.1 -u root minishop_test -e "SHOW TABLES;" || true
            mysql -h 127.0.0.1 -u root minishop_test -e "SELECT COUNT(*) AS produits FROM produit; SELECT COUNT(*) AS commandes FROM commande;" || true
            if [ -f tests/sql/rapport_tests_sql.md ]; then
              echo "--- rapport_tests_sql.md ---"
              cat tests/sql/rapport_tests_sql.md
            fi
            # Si le harnais manque, on ne fail pas la CI dev — le vrai harnais sera livré lot L8-13
            echo "ℹ run_sql_tests.sh absent : OK en dev GitHub (bloquant en GitLab prod quand livré)"
          fi

      - name: Setup PHP pour l'intégration SQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: none

      - name: Garde-fous et intégration SQL sur serveur jetable
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'etat=$?; echo "::error::Intégration SQL : échec ligne $LINENO (code $etat)"; for f in "$RUNNER_TEMP/integration-sql.log" "$RUNNER_TEMP/refus-app.log" "$RUNNER_TEMP/refus.log"; do if [ -f "$f" ]; then { grep -E "❌|ERREUR|ERROR|FAIL|[Éé]chec" "$f" || tail -7 "$f"; } | head -7 | while IFS= read -r ligne; do ligne=${ligne//%/%25}; echo "::error::${ligne}"; done; break; fi; done; exit "$etat"' ERR
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE minishop_safety_ci; CREATE TABLE minishop_safety_ci.temoin (id INT); INSERT INTO minishop_safety_ci.temoin VALUES (42);"
          if MINISHOP_TEST_DB=minishop_safety_ci DB_NAME=minishop php tests/php/sql_integration.php > "$RUNNER_TEMP/refus.log" 2>&1; then
            echo "Une base existante a été acceptée sans consentement"; exit 1
          fi
          grep -q 'création impossible' "$RUNNER_TEMP/refus.log"
          echo "::notice::Refus de base existante vérifié"
          test "$(mysql -h 127.0.0.1 -u root -N -e 'SELECT id FROM minishop_safety_ci.temoin')" = 42
          if MINISHOP_TEST_DB=minishop_safety_ci DB_NAME=minishop_safety_ci php tests/php/sql_integration.php --reinitialiser-base-existante > "$RUNNER_TEMP/refus-app.log" 2>&1; then
            echo "La base applicative a été acceptée"; exit 1
          fi
          grep -q 'correspond à DB_NAME' "$RUNNER_TEMP/refus-app.log"
          echo "::notice::Refus de base applicative vérifié"
          test "$(mysql -h 127.0.0.1 -u root -N -e 'SELECT id FROM minishop_safety_ci.temoin')" = 42
          MINISHOP_TEST_DB=minishop_safety_ci DB_NAME=minishop php tests/php/sql_integration.php --reinitialiser-base-existante 2>&1 | tee "$RUNNER_TEMP/integration-sql.log"
          if mysql -h 127.0.0.1 -u root -N -e "SHOW DATABASES LIKE 'minishop_safety_ci'" | grep -q .; then
            echo "Base de test non supprimée"; exit 1
          fi

      - name: Upload SQL rapport
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-rapport
          if-no-files-found: warn
          retention-days: 28
          path: |
            tests/sql/rapport_tests_sql.md
            tests/sql/out/

  # Tests de concurrence sur un répertoire temporaire distinct du dépôt.
  json-concurrence:
    name: Annulations JSON concurrentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - name: Deux processus PHP et magasin jetable
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/python -p test_annulation_concurrente.py -v 2>&1 | tee "$RUNNER_TEMP/concurrence.log" || {
            grep -E 'FAIL|ERROR|AssertionError|Traceback|Exception|Error:' "$RUNNER_TEMP/concurrence.log" | tail -12 | while IFS= read -r ligne; do
              ligne=${ligne//%/%25}; echo "::error::$ligne"
            done
            exit 1
          }

  # Serveur MariaDB dédié au job : les tests créent des bases temporaires.
  mariadb-regressions:
    name: MariaDB 11.8 et migration
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: minishop
      MINISHOP_MARIADB_INSTANCE_JETABLE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: none
      - name: Installer le client MariaDB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mariadb-client
      - name: Migration depuis une ancienne base peuplée
        run: python3 scripts/ci_php_diagnostic.py tests/php/migration_mariadb_test.php
      - name: Campagne SQL et intégration sur une base neuve
        shell: bash
        run: |
          set -o pipefail
          MINISHOP_TEST_DB=minishop_mariadb_ci php tests/php/sql_integration.php 2>&1 | tee "$RUNNER_TEMP/mariadb.log" || {
            grep -E '❌|FAIL|ERROR|ERREUR|échec|Fatal' "$RUNNER_TEMP/mariadb.log" | tail -15 | while IFS= read -r ligne; do
              ligne=${ligne//%/%25}; echo "::error::$ligne"
            done
            exit 1
          }

  responsive-chromium:
    name: Responsive Chromium réel
    # Playwright 1.56 prend en charge 24.04 ; ubuntu-latest migre vers 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl
          coverage: none
          tools: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Installer Chromium et ses dépendances système
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/chromium-install.log" || {
            tail -18 "$RUNNER_TEMP/chromium-install.log" | while IFS= read -r ligne; do
              ligne=${ligne//%/%25}; echo "::error::$ligne"
            done
            exit 1
          }
      - name: Parcours 375 et 1440 pixels sur copie jetable
        env:
          MINISHOP_BROWSER_ARTIFACTS: ${{ runner.temp }}/captures-responsive
        shell: bash
        run: |
          set -o pipefail
          node tests/node/responsive_navigateur.mjs 2>&1 | tee "$RUNNER_TEMP/chromium.log" || {
            tail -22 "$RUNNER_TEMP/chromium.log" | while IFS= read -r ligne; do
              ligne=${ligne//%/%25}; echo "::error::$ligne"
            done
            exit 1
          }
      - name: Captures de diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: responsive-chromium
          path: ${{ runner.temp }}/captures-responsive
          if-no-files-found: ignore
          retention-days: 7

  # -----------------------------------------------------------------
  # 5. Tests unitaires PHP (modèles, repositories, sécurité) sur base test
  #    Skip gracieux si pas de composer.json (lots L8-13)
  # -----------------------------------------------------------------
  unit:
    name: unit (phpunit)
    runs-on: ubuntu-latest
    needs: [db-tests]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: minishop_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ""
      DB_TEST: minishop_test
      MYSQL_DATABASE: minishop_test
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: Install mariadb-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mysqladmin ping -h 127.0.0.1 --wait=60 || true

      - name: Load DB for unit
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f scripts/load_db.sh ]; then
            DB_HOST=127.0.0.1 DB_USER=root DB_PASS="" ./scripts/load_db.sh
          else
            mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS minishop_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" || true
            mysql -h 127.0.0.1 -u root minishop_test < sql/01_minishop_schema.sql || true
            mysql -h 127.0.0.1 -u root minishop_test < sql/02_minishop_procedures.sql || true
            mysql -h 127.0.0.1 -u root minishop_test < sql/03_minishop_triggers.sql || true
            mysql -h 127.0.0.1 -u root minishop_test < sql/04_minishop_demo.sql || true
          fi

      - name: Composer install (si composer.json présent)
        shell: bash
        run: |
          if [ ! -f composer.json ]; then
            echo "ℹ composer.json absent (lots L8-13) — skip unit"
            exit 0
          fi
          if [ ! -f composer.phar ]; then curl -sS https://getcomposer.org/installer | php; fi
          php composer.phar install --prefer-dist --no-progress
          ls -lh vendor/bin/phpunit 2>/dev/null || true

      - name: PHPUnit
        shell: bash
        run: |
          if [ ! -f composer.json ]; then echo "composer.json absent"; exit 1; fi
          if [ ! -f vendor/bin/phpunit ]; then echo "phpunit absent"; exit 1; fi
          set +e
          ./vendor/bin/phpunit --testsuite app --log-junit phpunit.xml 2>&1 | tee "$RUNNER_TEMP/phpunit.log"
          etat=${PIPESTATUS[0]}
          set -e
          if [ "$etat" -ne 0 ]; then
            tail -12 "$RUNNER_TEMP/phpunit.log" | head -8 | while IFS= read -r ligne; do
              ligne=${ligne//%/%25}
              echo "::error::${ligne}"
            done
            exit "$etat"
          fi

      - name: Upload phpunit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phpunit-junit
          if-no-files-found: warn
          retention-days: 14
          path: phpunit.xml

  # -----------------------------------------------------------------
  # 6. Documentation : les diagrammes doivent se régénérer depuis les sources
  #    (plantuml.jar + docs/diagrams/render.sh) — non bloquant en dev si pas de .puml
  # -----------------------------------------------------------------
  docs:
    name: docs (plantuml)
    runs-on: ubuntu-latest
    needs: [php-lint]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PlantUML + Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl graphviz || true
          if [ ! -f plantuml.jar ]; then
            echo "→ download plantuml 1.2024.0"
            curl -sSL -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2024.0/plantuml-1.2024.0.jar
            ls -lh plantuml.jar
          fi
          java -jar plantuml.jar -version || true

      - name: Render diagrams
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f docs/diagrams/render.sh ]; then
            echo "ℹ docs/diagrams/render.sh absent — vérif manuelle des PNG"
            ls -lh docs/diagrams/*.png 2>/dev/null | head -n 20 || echo "aucun PNG"
            if ls docs/diagrams/src/*.puml 1>/dev/null 2>&1; then
              echo "→ rendu direct plantuml sur src/*.puml"
              java -jar plantuml.jar -tpng docs/diagrams/src/*.puml -o ../ || true
            fi
            exit 0
          fi
          chmod +x docs/diagrams/render.sh
          PLANTUML_JAR=plantuml.jar bash docs/diagrams/render.sh
          ls -lh docs/diagrams/*.png | head -n 20

      - name: Upload diagrams
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagrams
          if-no-files-found: warn
          retention-days: 7
          path: docs/diagrams/
